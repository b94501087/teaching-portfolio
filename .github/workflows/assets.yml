# One-off asset generation (binary files cannot be committed through the CMS / API tools):
#  - fonts: slice the official Taipei Sans TC Beta Light + Regular into unicode-range WOFF2 chunks
#  - board samples: fetch, resize and credit the sample images listed in build/samples/images.json
# Runs only when its inputs change; commits the results to main, then redeploys Pages.
name: Generate assets (fonts, sample images)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'build/fonts/**'
      - 'build/samples/**'
      - '.github/workflows/assets.yml'
permissions:
  contents: write
  actions: write
concurrency:
  group: assets
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install fonttools==4.65.0 brotli==1.1.0 pillow==11.3.0
      - name: Font chunks (official TTFs from JT Foundry, sha256-checked)
        run: python3 build/fonts/slice.py --download /tmp/ttf --out assets/fonts
      - name: Board sample images
        run: python3 build/samples/fetch.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fonts assets/board
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -q -m "Generated assets: Taipei Sans TC WOFF2 chunks, board sample images [assets.yml]"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
          echo "COMMITTED=1" >> "$GITHUB_ENV"
      - name: Redeploy Pages (pushes made with GITHUB_TOKEN do not trigger workflows)
        if: env.COMMITTED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
