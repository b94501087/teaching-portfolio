# Cloudflare Worker for the /admin save service.
# Deploy:  cd worker && npx wrangler deploy   (bundles ../admin/render.js for the shared pin validation)
# Secret:  npx wrangler secret put GITHUB_TOKEN   (fine-grained PAT: b94501087/teaching-portfolio only, Contents: Read and write)
name = "yuchuntsai-cms"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = false

# Requires the yuchuntsai.com DNS records to be proxied (orange cloud).
routes = [
  { pattern = "yuchuntsai.com/api/*", zone_name = "yuchuntsai.com" }
]

[vars]
GITHUB_OWNER = "b94501087"
GITHUB_REPO = "teaching-portfolio"
GITHUB_BRANCH = "main"
ALLOWED_EMAIL = "yuchuntsai@sjarchdesign.page"
ALLOWED_ORIGIN = "https://yuchuntsai.com"
# Cloudflare Access (Zero Trust → Access → Applications). Both values are public identifiers, not secrets.
# With both set, every request must carry a valid Cf-Access-Jwt-Assertion JWT: RS256 signature checked
# against https://<TEAM_DOMAIN>/cdn-cgi/access/certs, plus aud, iss, exp/nbf, and email == ALLOWED_EMAIL.
# Works with any Access login method (currently One-time PIN; Google later needs no change here).
TEAM_DOMAIN = "blue-rain-ed1c.cloudflareaccess.com"
POLICY_AUD = "cb1a54c8cfda326ec34ddaafd41dbbb746b07880b68265f7a03f1cb7e7f2b6d2"
